<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6efe6">
<title>For Simar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:#f6efe6;color:#6b5646;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden}
#bg svg{width:100%;height:100%;display:block}
#cam{position:absolute;inset:0;z-index:1;will-change:transform}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .7s ease;overflow:hidden}
.scene.on{opacity:1}
#liquid{position:absolute;inset:0;z-index:80;pointer-events:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(120,90,70,.10) 100%)}
.glass{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 24px 70px rgba(120,90,70,.20),inset 0 1px 0 rgba(255,255,255,.9);
  border-radius:28px;
}
.panel{
  padding:calc(18px + env(safe-area-inset-top)) 24px calc(18px + env(safe-area-inset-bottom));
  max-width:min(88vw,420px);width:100%;
}
.h{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:.01em;color:#6b5646}
.sub{font-size:13.5px;color:#8a7462;line-height:1.55}
.btn{
  appearance:none;border:1px solid rgba(255,255,255,.75);cursor:pointer;
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#7a5c50;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.03em;
  padding:14px 30px;border-radius:999px;min-height:48px;
  box-shadow:0 10px 30px rgba(120,90,70,.18),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),filter .16s ease,opacity .4s ease;
  will-change:transform;
}
.btn:active{transform:scale(.965);filter:brightness(1.05)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.rose{background:linear-gradient(180deg,rgba(226,154,166,.9),rgba(207,120,134,.92));color:#fff;border-color:rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(140,60,70,.3)}
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(120,90,70,.14);
  font-size:13px;font-weight:600;color:#8a6a58;
}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shakeX .45s ease}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes driftUp{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:.9}100%{transform:translateY(-46vh) scale(1.05);opacity:0}}
@keyframes swayBG{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3%, -2%) scale(1.06)}}
@keyframes swayBG2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-3%, 2%) scale(1)}}
.pop-in{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.fade-up{animation:fadeUp .7s ease both}
@keyframes fadeUp{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.key{
  height:62px;border-radius:20px;border:1px solid rgba(255,255,255,.75);
  background:rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:22px;font-family:Georgia,serif;color:#7a6252;
  box-shadow:0 6px 18px rgba(120,90,70,.12),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),filter .12s;cursor:pointer;
}
.key:active{transform:scale(.92);filter:brightness(1.06)}
.dots{display:flex;gap:14px;justify-content:center;margin:14px 0 4px}
.dot{width:14px;height:14px;border-radius:50%;border:1.6px solid #c9b3a2;background:transparent;transition:all .18s ease}
.dot.full{background:#d98a94;border-color:#d98a94;transform:scale(1.15)}
.flower{cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1);will-change:transform}
.flower.sel{transform:scale(1.12)}
.flower svg{overflow:visible;display:block}
.hiddenBtn{opacity:0;pointer-events:none;transform:translateY(20px)}
.showBtn{opacity:1;pointer-events:auto;transform:translateY(0);transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.cap{
  position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
  padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;color:#8a6a58;white-space:nowrap;
  background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(120,90,70,.14);
  transition:opacity .4s ease;
}
.scoreChip{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5}
.confetti{position:absolute;width:8px;height:12px;border-radius:3px;pointer-events:none;will-change:transform,opacity}
.smoke{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(160,160,165,.5);filter:blur(4px);pointer-events:none;will-change:transform,opacity}
.giftcard{cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.giftcard:active{transform:scale(.96)}
.lettertext{font-family:Georgia,serif;font-size:14.5px;line-height:1.75;color:#6f5a4b;white-space:pre-line}
@media (min-width:700px){.panel{max-width:460px}}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="cam"></div>
  <canvas id="liquid"></canvas>
</div>
<script>

/* ============ UTILS ============ */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const backOut=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function svgWrap(markup,w,h){return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" style="overflow:visible;display:block">${markup}</svg>`}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

/* ============ AUDIO ============ */
let AC=null,masterGain=null,audioUnlocked=false;
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();masterGain=AC.createGain();masterGain.gain.value=.5;masterGain.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
addEventListener('pointerdown',()=>{audioUnlocked=true;ac()},{once:false});
function tone(f,dur,o={}){
  if(!audioUnlocked)return;
  try{
    const c=ac(),t=c.currentTime+(o.delay||0);
    const os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
    if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,o.slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(o.vol||0.06,t+(o.a||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    os.connect(g);g.connect(masterGain);os.start(t);os.stop(t+dur+.05);
  }catch(e){}
}
function noise(dur,o={}){
  if(!audioUnlocked)return;
  try{
    const c=ac(),t=c.currentTime+(o.delay||0);
    const len=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,len,c.sampleRate);const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.setValueAtTime(o.freq||1200,t);
    if(o.freqEnd)f.frequency.exponentialRampToValueAtTime(o.freqEnd,t+dur);
    const g=c.createGain();g.gain.setValueAtTime(o.vol||0.12,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f);f.connect(g);g.connect(masterGain);src.start(t);
  }catch(e){}
}
const SFX={
  key(){tone(720,.07,{type:'triangle',vol:.05})},
  ok(){tone(523,.12,{vol:.06});tone(659,.12,{vol:.06,delay:.09});tone(784,.22,{vol:.07,delay:.18})},
  bad(){tone(220,.18,{type:'sawtooth',vol:.04,slide:160});tone(180,.2,{type:'sawtooth',vol:.035,delay:.1,slide:120})},
  arrow(){noise(.18,{vol:.08,freq:2500,freqEnd:600});tone(600,.18,{slide:1400,vol:.04})},
  impact(){tone(140,.15,{type:'sine',vol:.14,slide:70});noise(.12,{vol:.1,freq:900})},
  pop(){noise(.22,{vol:.2,freq:4000,freqEnd:400});tone(300,.2,{slide:60,vol:.12})},
  splash(){noise(.9,{vol:.16,freq:3000,freqEnd:200});noise(.5,{vol:.1,freq:600,delay:.1})},
  card(){tone(392,.15,{vol:.05});tone(523,.25,{vol:.05,delay:.12})},
  flower(){tone(880,.1,{type:'triangle',vol:.05});tone(1174,.14,{type:'triangle',vol:.04,delay:.06})},
  tickle(){tone(rand(900,1300),.06,{type:'triangle',vol:.035})},
  laugh(){tone(rand(500,700),.09,{type:'triangle',vol:.05,slide:rand(750,950)});tone(rand(600,800),.08,{type:'triangle',vol:.04,delay:.09,slide:rand(850,1100)})},
  gift(){tone(659,.12,{vol:.05});tone(880,.2,{vol:.05,delay:.1})},
  ribbon(){noise(.25,{vol:.05,freq:1800,freqEnd:2600})},
  release(){noise(.3,{vol:.09,freq:1200,freqEnd:300});tone(500,.2,{slide:220,vol:.04})},
  lid(){tone(330,.2,{type:'triangle',vol:.06,slide:520});noise(.15,{vol:.05,freq:800,delay:.05})},
  bouquet(){tone(523,.12,{vol:.04});tone(659,.12,{vol:.04,delay:.1});tone(784,.18,{vol:.045,delay:.2})},
  tie(){tone(700,.08,{vol:.05});tone(1050,.15,{vol:.05,delay:.08})},
  letter(){noise(.2,{vol:.05,freq:2000,freqEnd:3500});tone(587,.15,{vol:.04,delay:.15})},
  candle(){noise(.4,{vol:.03,freq:500,freqEnd:900})},
  blow(){noise(.5,{vol:.12,freq:1000,freqEnd:150});tone(400,.4,{slide:90,vol:.05})},
  lights(){tone(523,.3,{vol:.05});tone(659,.3,{vol:.05,delay:.15});tone(784,.45,{vol:.06,delay:.3});tone(1046,.6,{vol:.05,delay:.45})},
  cheer(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,{vol:.05,delay:i*.11}))},
  chaos(){noise(.15,{vol:.06,freq:700});tone(rand(300,500),.1,{type:'triangle',vol:.04,delay:.08})},
  curtain(){noise(.6,{vol:.05,freq:900,freqEnd:400})},
  scarf(){tone(784,.15,{vol:.05});tone(988,.2,{vol:.05,delay:.12});tone(1318,.3,{vol:.05,delay:.24})},
  collect(){tone(rand(1000,1400),.08,{type:'triangle',vol:.05})},
  eat(){tone(300,.1,{type:'triangle',vol:.05,slide:180});noise(.08,{vol:.04,freq:500})},
  envelope(){tone(659,.2,{vol:.045});tone(880,.35,{vol:.045,delay:.18})},
  count(){tone(880,.06,{type:'triangle',vol:.04})},
  pluck(){tone(523,.6,{type:'sine',vol:.028});tone(659,.6,{type:'sine',vol:.02,delay:.02});tone(784,.7,{type:'sine',vol:.018,delay:.05})}
};
let musicTimer=null;
function gentleMusic(on){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null}
  if(!on)return;
  const notes=[523,587,659,784,880,1046];
  let i=0;
  musicTimer=setInterval(()=>{tone(notes[i%notes.length]+(i%3===0?0:0),.9,{vol:.014});tone(notes[(i+2)%notes.length]/2,1.1,{vol:.01});i++},1400);
}

/* ============ CAMERA ============ */
const Cam={x:0,y:0,z:1,tx:0,ty:0,tz:1,blur:0,tblur:0,
  update(dt){
    const k=1-Math.pow(0.002,dt);
    this.x=lerp(this.x,this.tx,k);this.y=lerp(this.y,this.ty,k);this.z=lerp(this.z,this.tz,k);
    this.blur=lerp(this.blur,this.tblur,k);
    const w=innerWidth,h=innerHeight;
    $('#cam').style.transform=`translate(${w/2}px,${h/2}px) scale(${this.z}) translate(${-w/2-this.x}px,${-h/2-this.y}px)`;
    $('#cam').style.filter=this.blur>0.2?`blur(${this.blur}px)`:'';
  },
  set(x,y,z,dur){this.tx=x;this.ty=y;this.tz=z}
};

/* ============ BACKGROUND ============ */
function buildBG(){
  $('#bg').innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
    <rect width="100" height="100" fill="#f6efe6"/>
    <ellipse cx="20" cy="25" rx="26" ry="20" fill="#f3e2dd" opacity=".7" style="transform-origin:20% 25%;animation:swayBG 26s ease-in-out infinite"/>
    <ellipse cx="80" cy="70" rx="30" ry="24" fill="#e2ebe2" opacity=".7" style="transform-origin:80% 70%;animation:swayBG2 32s ease-in-out infinite"/>
    <ellipse cx="65" cy="15" rx="22" ry="16" fill="#eee4f0" opacity=".55" style="transform-origin:65% 15%;animation:swayBG 38s ease-in-out infinite"/>
    <ellipse cx="25" cy="80" rx="26" ry="18" fill="#f5e9d4" opacity=".7" style="transform-origin:25% 80%;animation:swayBG2 30s ease-in-out infinite"/>
    <path d="M0,60 Q25,50 50,60 T100,60" fill="none" stroke="#e8d9c8" stroke-width=".6" opacity=".6"/>
    <path d="M0,72 Q25,64 50,72 T100,72" fill="none" stroke="#e3d4e6" stroke-width=".5" opacity=".5"/>
  </svg>`;
}

/* ============ SCENE MANAGER ============ */
let RUN=0;
class Scene{
  constructor(name){
    this.name=name;this.alive=false;this._timers=[];this._rafs=[];this._ls=[];
    this.el=el('div','scene');this.el.id='sc-'+name;
  }
  mount(){
    Cam.x=Cam.tx=Cam.y=Cam.ty=0;Cam.z=Cam.tz=1;Cam.blur=Cam.tblur=0;
    $('#cam').appendChild(this.el); requestAnimationFrame(()=>this.el.classList.add('on')); this.alive=true;
  }
  on(t,node,fn,opt){ node.addEventListener(t,fn,opt); this._ls.push([node,t,fn,fn]); }
  after(ms,fn){ const id=setTimeout(()=>{if(this.alive)fn()},ms); this._timers.push(id); return id; }
  every(ms,fn){ const id=setInterval(()=>{if(this.alive)fn()},ms); this._timers.push(id); return id; }
  raf(fn){
    let last=performance.now();
    const step=(now)=>{
      if(!this.alive||RUN!==this.run)return;
      const dt=Math.min(0.05,(now-last)/1000);last=now;
      fn(dt,now/1000);
      this._rafs.push(requestAnimationFrame(step));
    };
    this._rafs.push(requestAnimationFrame(step));
  }
  exit(){
    this.alive=false;
    this._timers.forEach(clearTimeout);this._timers=[];
    // intervals also stored in _timers
    this._rafs.forEach(cancelAnimationFrame);this._rafs=[];
    this._ls.forEach(([n,t,f])=>n.removeEventListener(t,f));this._ls=[];
    this.el.classList.remove('on');
    const e=this.el;
    setTimeout(()=>e.remove(),750);
  }
}
let activeScene=null;
function goto(name,arg){
  RUN++;
  if(activeScene)activeScene.exit();
  const s=Scenes[name](arg);
  s.run=RUN;
  activeScene=s;
  s.mount();
  return s;
}
function fullReset(){
  RUN++;
  gentleMusic(false);
  if(activeScene){activeScene.alive=false;activeScene._timers.forEach(t=>{clearTimeout(t);clearInterval(t)});activeScene._rafs.forEach(cancelAnimationFrame);activeScene.el.remove();activeScene=null}
  Cam.x=Cam.y=Cam.tx=Cam.ty=0;Cam.z=Cam.tz=1;Cam.blur=Cam.tblur=0;
  G.code='';G.flowers=[];G.tickled=0;G.ribbonDone=false;G.wrapper=null;G.candleOut=false;G.counted=false;G.score=0;G.roundness=0;G.catX=0;
  clearCanvas();
  goto('code');
}
function loop(fn){let last=performance.now();const step=(now)=>{const dt=Math.min(.05,(now-last)/1000);last=now;fn(dt);requestAnimationFrame(step)};requestAnimationFrame(step)}

/* ============ ART BUILDERS ============ */
let UID=0;
function CAT(opts={}){
  const fur=opts.fur||'#fdf8f0', line=opts.line||'#8d7461', acc=opts.acc||'';
  const s=svgWrap(`
  <g class="cat-tail" style="transform-box:fill-box;transform-origin:85% 92%"><path d="M72,208 C40,202 24,180 33,156 C38,143 49,139 56,145" fill="none" stroke="${fur}" stroke-width="14" stroke-linecap="round"/><path d="M72,208 C40,202 24,180 33,156 C38,143 49,139 56,145" fill="none" stroke="${line}" stroke-width="3" stroke-linecap="round" opacity=".85"/></g>
  <g class="cat-bodyg">
    <ellipse class="cat-hind" cx="74" cy="208" rx="17" ry="11" fill="${fur}" stroke="${line}" stroke-width="3" transform="rotate(-12 74 208)"/>
    <path d="M110,110 C76,110 60,144 62,176 C64,208 84,222 110,222 C136,222 156,208 158,176 C160,144 144,110 110,110 Z" fill="${fur}" stroke="${line}" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="110" cy="180" rx="30" ry="34" fill="#fff" opacity=".45"/>
    <g class="cat-splat" style="display:none"><circle cx="92" cy="150" r="9" fill="#f0d49a" stroke="#c8a05e" stroke-width="1.5"/><circle cx="128" cy="168" r="7" fill="#e8b4bc" stroke="#c98896" stroke-width="1.5"/><circle cx="104" cy="196" r="6" fill="#f0d49a" stroke="#c8a05e" stroke-width="1.5"/></g>
  </g>
  <g class="cat-pawl" style="transform-box:fill-box;transform-origin:50% 8%"><ellipse cx="94" cy="196" rx="9.5" ry="19" fill="${fur}" stroke="${line}" stroke-width="3" transform="rotate(-7 94 196)"/><path d="M90,206 L90,212 M97,206 L97,212" stroke="${line}" stroke-width="2" stroke-linecap="round"/></g>
  <g class="cat-pawr" style="transform-box:fill-box;transform-origin:50% 8%"><ellipse cx="126" cy="196" rx="9.5" ry="19" fill="${fur}" stroke="${line}" stroke-width="3" transform="rotate(7 126 196)"/><path d="M122,206 L122,212 M129,206 L129,212" stroke="${line}" stroke-width="2" stroke-linecap="round"/></g>
  <g class="cat-headg">
    <g class="cat-earl" style="transform-box:fill-box;transform-origin:70% 95%"><path d="M82,54 C75,40 70,27 75,15 C87,21 98,30 102,43 Z" fill="${fur}" stroke="${line}" stroke-width="3" stroke-linejoin="round"/><path d="M84,47 C80,38 78,30 80,24 C87,28 93,34 96,41 Z" fill="#f2b8bf"/></g>
    <g class="cat-earr" style="transform-box:fill-box;transform-origin:30% 95%"><path d="M138,54 C145,40 150,27 145,15 C133,21 122,30 118,43 Z" fill="${fur}" stroke="${line}" stroke-width="3" stroke-linejoin="round"/><path d="M136,47 C140,38 142,30 140,24 C133,28 127,34 124,41 Z" fill="#f2b8bf"/></g>
    ${acc==='hoodie'?`<path d="M110,28 C70,28 55,64 59,92 L74,86 C69,62 86,42 110,42 C134,42 151,62 146,86 L161,92 C165,64 150,28 110,28 Z" fill="#e79fb2" stroke="#c77f92" stroke-width="3" stroke-linejoin="round"/><path d="M74,86 C82,108 94,118 110,118 C126,118 138,108 146,86" fill="none" stroke="#c77f92" stroke-width="3" stroke-linecap="round"/>`:''}
    ${acc==='party'?`<g class="cat-accp" style="transform-box:fill-box;transform-origin:50% 100%"><path d="M96,44 L110,2 L124,44 Z" fill="#e8a0b0" stroke="#c77f92" stroke-width="2.5" stroke-linejoin="round"/><path d="M101,32 L119,32 M104,22 L116,22" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/><circle cx="110" cy="4" r="6" fill="#f6d98a" stroke="#d8b45e" stroke-width="2"/></g>`:''}
    ${acc==='detective'?`<g><path d="M72,52 C74,28 90,18 110,18 C130,18 146,28 148,52 C132,42 88,42 72,52 Z" fill="#a8907a" stroke="#7a6250" stroke-width="3" stroke-linejoin="round"/><path d="M110,18 L110,42 M86,24 C96,32 104,38 110,42 M134,24 C124,32 116,38 110,42" stroke="#7a6250" stroke-width="2" fill="none"/><ellipse cx="110" cy="50" rx="46" ry="8" fill="#8a7260" stroke="#7a6250" stroke-width="2.5"/></g>`:''}

/* ============ LIQUID ENGINE ============ */
const liq={cv:null,ctx:null,blobs:[],active:false};
function clearCanvas(){if(liq.ctx){liq.ctx.clearRect(0,0,liq.cv.width,liq.cv.height)}liq.active=false;liq.blobs=[]}
function liquidTransition(x,y,nextScene,arg){
  ac();SFX.splash();
  liq.cv=$('#liquid');liq.cv.width=innerWidth*devicePixelRatio;liq.cv.height=innerHeight*devicePixelRatio;
  liq.cv.style.width='100%';liq.cv.style.height='100%';
  liq.ctx=liq.cv.getContext('2d');liq.ctx.scale(devicePixelRatio,devicePixelRatio);
  liq.active=true;
  const cols=['#d4526a','#c23a54','#e06a80','#b03048','#e88a96'];
  for(let i=0;i<42;i++){
    const a=rand(0,Math.PI*2),sp=rand(60,i<10?260:520);
    liq.blobs.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:rand(4,i<10?26:12),vr:rand(120,420),col:cols[i%cols.length],wob:rand(0,9)});
  }
  const t0=performance.now();let swapped=false;
  const colPos=x,yPos=y;
  function frame(now){
    if(!liq.active)return;
    const t=(now-t0)/1000,ctx=liq.ctx,W=innerWidth,H=innerHeight;
    ctx.clearRect(0,0,W,H);
    let cover=0;
    liq.blobs.forEach(b=>{
      const ph=clamp((t-0.05)/1.1,0,1);
      b.x+=b.vx*0.016;b.y+=b.vy*0.016;b.vx*=0.985;b.vy*=0.985;
      const r=b.r+b.vr*easeOut(ph)+Math.sin(t*6+b.wob)*6;
      if(ph>=1){b.vr+=30;b.x+=b.vx*0.02;b.y+=b.vy*0.02}
      ctx.beginPath();ctx.arc(b.x,b.y,Math.max(0,r),0,7);
      ctx.fillStyle=b.col;ctx.fill();
    });
    // fill gaps as it expands
    const fillPh=clamp((t-0.12)/0.9,0,1);
    if(fillPh>0&&fillPh<1){
      ctx.globalAlpha=Math.min(1,fillPh*1.4);
      ctx.fillStyle='#c9405a';
      const rr=Math.hypot(W,H)*easeOut(fillPh);
      ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }
    if(fillPh>=1&&!swapped){
      swapped=true;
      goto(nextScene,arg);
    }
    if(swapped){
      // retreat: blobs fly outward, reveal underneath
      const rp=clamp((t-1.55)/1.0,0,1);
      ctx.globalAlpha=1-rp*0.0;
      liq.blobs.forEach(b=>{b.vx*=1.03;b.vy*=1.03;b.x+=b.vx*0.03;b.y+=b.vy*0.03});
      // erase center-out
      ctx.globalCompositeOperation='destination-out';
      const er=ctx.createRadialGradient(W/2,H/2,Math.hypot(W,H)*0.1*(1-rp),W/2,H/2,Math.hypot(W,H)*(0.25+0.9*rp));
      er.addColorStop(0,'rgba(0,0,0,'+(rp)+')');er.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=er;ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=1-rp;
      if(rp>=1){clearCanvas();return}
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

    cl.appendChild(c);
  }
  const cat=CAT();cat.el.style.cssText='position:absolute;left:8%;bottom:16%;width:min(34vw,150px)';
  s.el.appendChild(cat.el);
  const hw=$('#heart-wrap',s.el);hw.innerHTML=HEART(1.4);
  // camera tilts up
  s.after(700,()=>{Cam.set(0,-innerHeight*0.18,1.25,2);hw.style.opacity='1';cat.setMode('worried');cat.face('wide')});
  s.after(2200,()=>{$('#heart-hint',s.el).style.opacity='1';$('#bow',s.el).style.opacity='1'});
  // aim
  let aiming=false,hit=false;
  const rot=$('#bowrot',s.el);
  s.on('pointerdown',s.el,e=>{
    if(hit)return;
    if(e.target.closest('.panel'))return;
    aiming=true;SFX.arrow&&0;
  });
  s.on('pointermove',s.el,e=>{
    if(!aiming||hit)return;
    const r=s.el.getBoundingClientRect();
    const dx=e.clientX-(r.left+innerWidth/2), dy=(r.top+innerHeight*0.9)-(e.clientY);
    let ang=Math.atan2(dy,dx)*180/Math.PI-90;
    ang=clamp(ang,-70,70);
    rot.style.transform=`rotate(${-ang}deg)`;
    s._ang=ang;
  });
  s.on('pointerup',s.el,e=>{
    if(!aiming||hit)return;aiming=false;
    if(s._ang==null)return;
    hit=true;SFX.arrow();buzz(10);
    // arrow flies
    const arr=el('div');arr.style.cssText='position:absolute;left:50%;bottom:24%;width:4px;height:70px;margin-left:-2px;background:#8d7461;border-radius:2px;transform-origin:50% 100%;z-index:6';
    arr.style.transform=`rotate(${-s._ang}deg)`;
    s.el.appendChild(arr);
    const rad=(90-s._ang)*Math.PI/180;
    let d=0;const sp=1400;
    s.raf(dt=>{
      if(arr._done)return;
      d+=sp*dt;
      arr.style.transform=`rotate(${-s._ang}deg) translateY(${-d}px)`;

      const hr=hw.getBoundingClientRect();

      const ax=ar.left+ar.width/2,ay=ar.top;

        impactHeart();
      }
      if(ay<-80){arr._done=true;arr.remove();hit=false}
    });
  });

    SFX.impact();buzz(60);
    $('#heart-hint',s.el).style.opacity='0';
    $('#heart-msg',s.el).innerHTML='Direct hit!';
    let t=0;
    s.raf(dt=>{
      if(hw._popped)return;
      t+=dt;
      const squash=t<0.15?1+ (t/0.15)*0.18:0;
      const stretch=t>=0.15&&t<0.32?1:0;
      let sx=1,sy=1;
      if(t<0.15){sy=1-0.22*(t/0.15);sx=1+0.18*(t/0.15)}
      else if(t<0.32){sy=1+0.28*((t-0.15)/0.17);sx=1-0.2*((t-0.15)/0.17)}
      else if(t<0.75){const k=(t-0.32)/0.43;sx=sy=1+0.4*easeOut(k)}
      else {hw._popped=true;popHeart()}
      hw.style.transform=`translate(-50%,-50%) scale(${sx},${sy})`;
    });
  }
  function popHeart(){
    SFX.pop();buzz([30,40,80]);

    }
    s.after(350,()=>{
      const r=hw.getBoundingClientRect();
      liquidTransition(r.left+r.width/2,r.top+r.height/2,'card');
    });
  }
  s.raf(dt=>cat.update(dt));
  return s;
}

        G.flowers.push(i);f.classList.add('sel');ring.style.opacity='1';SFX.flower();buzz(10);
        f.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1.12)'}],{duration:350,easing:'ease-out'});
      } else {f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');SFX.bad();return}
      $('#g-count',s.el).textContent=`${G.flowers.length} / 7 selected`;
      const go=$('#g-go',s.el);
      if(G.flowers.length===7){go.classList.remove('hiddenBtn');go.classList.add('showBtn');SFX.ok()}
      else {go.classList.remove('showBtn');go.classList.add('hiddenBtn')}
    });
  });
  s.raf(dt=>{
    const t=performance.now()/1000;
    sway.forEach(o=>{o.el.querySelector('.tulip-bloom, svg').style.transform=`rotate(${Math.sin(t*o.sp+o.ph)*o.amp}deg)`;o.el.querySelector('svg').style.transformOrigin='50% 96%'});
  });
  s.on('pointerdown',$('#g-go',s.el),()=>{if(G.flowers.length===7){SFX.gift();buzz(15);goto('tickle')}});
  return s;
}

/* ============ RIBBON UNTIE (reusable) ============ */
function ribbonUntie(s,container,onDone){
  const tl=container.querySelector('.bow-tl'),tr=container.querySelector('.bow-tr'),kn=container.querySelector('.bow-knot'),ta=container.querySelector('.bow-taill'),tb=container.querySelector('.bow-tailr');
  let dragging=false,lastX=0,prog=0,done=false;
  const bow=container.querySelector('.gift-bow');
  function apply(){
    tl.style.transform=`rotate(${-prog*75}deg) translate(${-prog*16}px,${prog*8}px) scale(${1-prog*.35})`;
    tr.style.transform=`rotate(${prog*75}deg) translate(${prog*16}px,${prog*8}px) scale(${1-prog*.35})`;
    kn.style.transform=`scale(${1-prog*.55},${1-prog*.4}) translateY(${prog*10}px)`;
    ta.style.transform=`rotate(${-prog*40}deg) scaleY(${1+prog*.5}) translateY(${prog*10}px)`;
    tb.style.transform=`rotate(${prog*40}deg) scaleY(${1+prog*.5}) translateY(${prog*10}px)`;
  }
  s.on('pointerdown',bow,e=>{if(done)return;dragging=true;lastX=e.clientX;e.preventDefault();SFX.ribbon();buzz(8)});
  s.on('pointermove',s.el,e=>{
    if(!dragging||done)return;
    const dx=e.clientX-lastX;lastX=e.clientX;
    if(Math.abs(dx)>0){prog=clamp(prog+Math.abs(dx)/260,0,1);apply();if(Math.random()<.3)SFX.tickble||SFX.ribbon()}
    if(prog>=1){done=true;dragging=false;SFX.release();buzz([15,30,25]);
      bow.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(90px) rotate(20deg)',opacity:0}],{duration:600,easing:'ease-in',fill:'forwards'});
      s.after(550,onDone);
    }
  });
  s.on('pointerup',s.el,()=>{dragging=false});
  s.on('pointercancel',s.el,()=>{dragging=false});
  return {get done(){return done}};
}

  const party=$('#party',s.el);
  const cast=[
    {c:CAT({fur:'#fdf8f0'}),x:'12%',y:'46%',sc:.85,ph:0},
    {c:CAT({fur:'#e8d3b0'}),x:'74%',y:'44%',sc:.9,ph:2},
    {c:DOG({fur:'#e8d3b0'}),x:'2%',y:'62%',sc:.8,ph:4},
    {c:DOG({fur:'#c9b8a6',earCol:'#a8907a'}),x:'82%',y:'60%',sc:.85,ph:1}
  ];
  cast.forEach(a=>{a.c.el.style.cssText=`position:absolute;left:${a.x};top:${a.y};width:${Math.round(150*a.sc)}px;opacity:0;transition:opacity .6s`;party.appendChild(a.c.el);a.c.setMode('happy')});
  // eyes in the dark
  const eyes=$('#eyes',s.el);
  cast.forEach((a,i)=>{
    const e=el('div');
    e.style.cssText=`position:absolute;left:${a.x};top:${a.y};width:60px;height:20px;filter:drop-shadow(0 0 6px rgba(255,230,150,.9))`;
    e.innerHTML=`<svg viewBox="0 0 60 20"><ellipse cx="16" cy="10" rx="6" ry="${i%2?4:6}" fill="#ffe9a8"/><ellipse cx="44" cy="10" rx="6" ry="${i%2?4:6}" fill="#ffe9a8"/></svg>`;
    eyes.appendChild(e);a.glow=e;
  });
  // flame flicker
  const flame=$('.flame',s.el);
  s.raf(dt=>{const t=performance.now()/1000;flame.style.transform=`scale(${1+Math.sin(t*11)*.08},${1+Math.sin(t*13)*.12}) rotate(${Math.sin(t*7)*4}deg)`});
  // long press candle
  const cake=$('#cake',s.el);
  let holding=false,holdP=0,litOut=false,phase='candle';
  const progRing=el('div');
  progRing.style.cssText='position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;pointer-events:none;opacity:0;transition:opacity .3s';
  progRing.innerHTML=`<svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="5"/><circle id="hold-ring" cx="55" cy="55" r="48" fill="none" stroke="#f6d98a" stroke-width="5" stroke-linecap="round" transform="rotate(-90 55 55)" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg>`;
  cake.style.position='absolute';cake.appendChild(progRing);
  s.on('pointerdown',cake,e=>{if(phase!=='candle')return;holding=true;progRing.style.opacity='1';SFX.candle();buzz(8)});
  s.on('pointerup',s.el,()=>{if(phase==='candle'){holding=false;holdP=0;progRing.style.opacity='0';$('#hold-ring',s.el).style.strokeDashoffset='301.6'}});
  s.raf(dt=>{
    if(phase==='candle'&&holding){
      holdP=clamp(holdP+dt/1.5,0,1);
      $('#hold-ring',s.el).style.strokeDashoffset=String(301.6*(1-holdP));
      flame.style.transform+=` rotate(${holdP*38}deg) scale(${1-holdP*.25},${1-holdP*.1})`;
      if(Math.random()<.15)SFX.tickble||0;
      if(holdP>=1){phase='out';blowOut()}
    }
  });
  function blowOut(){
    SFX.blow();buzz([20,40,30]);holding=false;progRing.style.opacity='0';
    flame.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.1) translateY(6px)'}],{duration:500,fill:'forwards'});
    // smoke
    for(let i=0;i<6;i++){
      const sm=el('div','smoke');sm.style.left='50%';sm.style.bottom='150px';
      $('#room',s.el).appendChild(sm);
      sm.animate([{transform:'translate(0,0) scale(.6)',opacity:.7},{transform:`translate(${rand(-24,24)}px,-${rand(90,170)}px) scale(${rand(1.6,2.6)})`,opacity:0}],{duration:rand(1400,2200),delay:i*180,easing:'ease-out'}).onfinish=()=>sm.remove();
    }
    s.after(800,()=>{
      SFX.lights();
      $('#lighton',s.el).style.opacity='1';
      $('#room',s.el).style.filter='brightness(1.15)';
      cap('');
      s.after(700,()=>{
        cast.forEach((a,i)=>{s.after(i*160,()=>{a.c.el.style.opacity='1';a.glow.style.opacity='0';SFX.cheer()})});
        $('#banner',s.el).style.transform='translateX(-50%) translateY(0)';
        gentleMusic(true);
        confettiBurst(s.el,30);
        phase='party';partyT=0;
      });
    });
  }
  // party + chaos driver
  let partyT=0,chaosT=0,chaosOn=false;
  s.raf(dt=>{
    cast.forEach(a=>a.c.update(dt));
    if(phase==='party'){
      partyT+=dt;
      const t=performance.now()/1000;
      cast.forEach((a,i)=>{
        const sp=4.2+(i%3)*1.1;
        a.c.el.style.transform=`translateY(${-Math.abs(Math.sin(t*sp+a.ph))*16}px) rotate(${Math.sin(t*2+a.ph)*4}deg)`;
      });
      if(Math.random()<.006)confettiBurst(s.el,8);
      if(partyT>5.5&&!chaosOn){chaosOn=true;phase='chaos';startChaos()}
    } else if(phase==='chaos'){
      chaosT+=dt;
      if(chaosT>5.2){phase='approach';worriedApproach()}
    }
  });
  function startChaos(){
    SFX.chaos();cap('The cake is under attack!');
    const cakeEl=$('#cake',s.el);
    let n=0;
    const iv=s.every(650,()=>{
      n++;
      const a=cast[Math.floor(Math.random()*cast.length)];
      const b=cast[Math.floor(Math.random()*cast.length)];
      if(a!==b){
        a.c.setMode('laugh');b.c.setMode('laugh');
        a.c.el.animate([{transform:'translateX(0)'},{transform:`translateX(${rand(-40,40)}px) translateY(-14px)`},{transform:'translateX(0)'}],{duration:600,easing:'ease-in-out'});
        s.after(280,()=>{b.c.splatOn();SFX.eat();buzz(8)});
      }
      cakeEl.animate([{transform:'translateX(-50%) translateY(0) rotate(0)'},{transform:`translateX(-50%) translateY(${rand(-70,-30)}px) rotate(${rand(-16,16)}deg)`},{transform:'translateX(-50%) translateY(0) rotate(0)'}],{duration:620,easing:'ease-in-out'});
      if(n>=6){cast.forEach(a=>a.c.splatOn());cakeEl.style.transform='translateX(-50%) rotate(8deg)';clearInterval(iv)}
    });
  }
  function worriedApproach(){
    cap('');
    SFX.chaos();
    const w=CAT({});w.setMode('worried');
    w.el.style.cssText='position:absolute;left:50%;top:56%;width:170px;margin-left:-85px;z-index:7;opacity:0';
    s.el.appendChild(w.el);
    s._w=w;
    w.el.style.transition='opacity .4s';w.el.style.opacity='1';
    // camera follows approach
    let t=0;
    s.raf(dt=>{
      if(s._wDone)return;
      t+=dt;
      const k=easeOut(clamp(t/2.2,0,1));
      const sc=1+k*2.6;
      w.el.style.transform=`translateY(${k*-40}px) scale(${sc})`;
      Cam.set(0,-innerHeight*.06,1+k*.5);
      if(k>.55){w.parts.pawL.style.transform=`rotate(${-70*(k-.55)/.45}deg)`;w.parts.pawR.style.transform=`rotate(${70*(k-.55)/.45}deg)`}
      if(k>=1){s._wDone=true;grabCurtains(w)}
    });
    s.raf(dt=>w.update(dt));
  }
  function grabCurtains(w){
    SFX.curtain();buzz(12);
    $('#curt-l',s.el).style.transform='translateX(-4%)';
    $('#curt-r',s.el).style.transform='translateX(4%)';
    s.after(1000,()=>{
      w.el.style.transition='opacity .5s';w.el.style.opacity='0';
      s.after(600,startCountdown);
    });
  }
  function startCountdown(){
    const c=$('#count',s.el);c.style.display='block';
    let t=10;$('#count-num',s.el).textContent='10';SFX.count();
    const t0=performance.now();
    s.raf(()=>{
      const el2=(performance.now()-t0)/1000;
      const rem=Math.max(0,10-el2);
      $('#count-ring',s.el).style.strokeDashoffset=String(326.7*(el2/10));
      const n=Math.ceil(rem);
      if(n!==t&&n>0){t=n;$('#count-num',s.el).textContent=n;SFX.count()}
    });
    s.after(10200,openCurtain);
  }
  function openCurtain(){
    SFX.curtain();SFX.cheer();buzz([15,40,20]);
    $('#count',s.el).style.display='none';
    $('#curt-l',s.el).style.transform='translateX(-104%)';
    $('#curt-r',s.el).style.transform='translateX(104%)';
    // innocent cake-covered crew + happy cat
    cast.forEach((a,i)=>{a.c.splatOn();a.c.setMode('sit');a.c.face('n');a.c.el.style.opacity='1'});
    const w=s._w;w.splatOn();w.setMode('happy');w.face('happy');
    w.el.style.transform='translateY(-40px) scale(3.6)';w.el.style.opacity='1';w.el.style.zIndex='5';
    s.after(700,()=>{
      // gift appears on table
      const g=$('#gift2',s.el);g.innerHTML=GIFT('#a8bcd8','#f6e7c9');
      g.style.transition='all .6s cubic-bezier(.34,1.56,.64,1)';g.style.opacity='1';g.style.transform='scale(1) rotate(-4deg)';
      SFX.gift();
      cap('A gift appeared on the table…');
      s.on('pointerdown',g,()=>{
        if(phase!=='table')return;phase='gift2';
        SFX.gift();buzz(15);
        Cam.set(0,0,1.3);
        s.el.style.perspective='800px';
        const gb=$('#gift2big',s.el);gb.innerHTML=GIFT('#a8bcd8','#f6e7c9');
        gb.style.opacity='1';gb.style.pointerEvents='auto';gb.style.transform='translate(-50%,-50%) scale(1)';
        g.style.opacity='0';
        $('#room',s.el).style.filter='brightness(1.15) blur(5px)';
        $('#lighton',s.el).style.filter='blur(5px)';
        $('#table',s.el).style.filter='blur(5px)';$('#cake',s.el).style.filter='blur(5px)';
        party.style.filter='blur(5px)';
        cap('Drag the bow to untie the ribbon');
        ribbonUntie(s,gb,()=>{
          cap('Tap the lid to open');
          const lid=$('.gift-lidg',gb);
          lid.style.transition='transform .7s cubic-bezier(.3,1.3,.4,1), opacity .7s';
          s.on('pointerdown',lid,()=>{
            SFX.lid();buzz(20);
            lid.style.transform='translateY(-100px) rotate(-16deg)';lid.style.opacity='0';
            cap('');
            s.after(650,revealScarves);
          });
        });
      });
    });
    phase='table';
  }
  function revealScarves(){
    const sc=$('#scarves',s.el);sc.style.display='flex';
    SFX.scarf();buzz([12,30,20]);
    sc.innerHTML=`
      <div class="glass panel" style="text-align:center;padding:18px 22px">
        <div class="h" style="font-size:18px">Two little scarves for you</div>
        <div id="sc1" style="width:100%;margin-top:10px;opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.3,1.3,.4,1)">${SCARF('leopard')}</div>
        <div class="sub" style="margin-top:2px;font-weight:600">Leopard print — with a tiny panther</div>
        <div id="sc2" style="width:100%;margin-top:14px;opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.3,1.3,.4,1)">${SCARF('panther')}</div>
        <div class="sub" style="margin-top:2px;font-weight:600">Panther print — with a tiny leopard</div>
        <button class="btn rose" id="claim2" style="margin-top:16px;width:100%;opacity:0;pointer-events:none;transition:opacity .6s">Claim Your Gift</button>
      </div>`;
    s.after(200,()=>{const a=$('#sc1',s.el);a.style.opacity='1';a.style.transform='translateY(0)'});
    s.after(700,()=>{const a=$('#sc2',s.el);a.style.opacity='1';a.style.transform='translateY(0)'});
    s.after(1500,()=>{const b=$('#claim2',s.el);b.style.opacity='1';b.style.pointerEvents='auto'});
    s.on('pointerdown',$('#claim2',s.el),()=>{SFX.ok();buzz([15,40,25]);goto('minigame')});
  }
  return s;
}

/* ============ SCENE: MINI GAME — CATCH THE HEARTS ============ */
function scMinigame(){
  const s=new Scene('minigame');
  const W=Math.max(innerWidth*1.8,900), H=innerHeight;
  s.el.innerHTML=`
    <div id="mg-world" style="position:absolute;top:0;bottom:0;width:${W}px">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,#f7e8ec 0%,#f9efe6 60%,#e8d5c8 100%)"></div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,#cfe0c2,#b8cfa8);border-radius:50% 50% 0 0/30px 30px 0 0"></div>
      <div id="mg-decor"></div>
      <div id="mg-cat" style="position:absolute;bottom:16%;left:${W/2}px;width:150px;margin-left:-75px;z-index:3"></div>
    </div>
    <div class="chip scoreChip" id="mg-score" style="z-index:10">Love collected: 0 / 20</div>
    <div class="h" id="mg-title" style="position:absolute;top:calc(52px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:22px;z-index:10;transition:opacity .5s">Catch the Hearts</div>
    <div class="glass panel" id="mg-msg" style="position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);z-index:11;text-align:center;opacity:0;transition:all .6s cubic-bezier(.34,1.5,.64,1)">
      <div class="h" style="font-size:22px">You collected enough love!</div>
      <div class="sub" style="margin-top:6px">20 / 20 — the little cat is full and happy</div>
    </div>
    <div class="cap" id="mg-cap" style="z-index:10">Drag left and right to run & catch the falling treats</div>`;
  // decor: little tulips + bushes
  const dec=$('#mg-decor',s.el);
  for(let i=0;i<10;i++){
    const b=el('div');b.style.cssText=`position:absolute;bottom:20%;left:${rand(2,98)}%;width:${rand(50,90)}px;opacity:.8`;
    b.innerHTML=`<svg viewBox="0 0 90 50"><ellipse cx="30" cy="34" rx="26" ry="16" fill="#a8c498"/><ellipse cx="58" cy="38" rx="22" ry="13" fill="#98b888"/></svg>`;
    dec.appendChild(b);
  }
  for(let i=0;i<6;i++){
    const f=el('div');f.style.cssText=`position:absolute;bottom:23%;left:${rand(4,94)}%;width:34px;opacity:.9`;
    f.innerHTML=TULIP(['pink','white','yellow','blue','red','pink'][i]);dec.appendChild(f);
  }
  const cat=CAT({acc:'hoodie'});cat.setMode('run');cat.face('happy');
  $('#mg-cat',s.el).appendChild(cat.el);
  let catX=W/2,targetX=W/2,phase='play',score=0,spawnT=0,walkT=0;
  const foods=[];
  // input: drag anywhere
  let dragging=false;
  s.on('pointerdown',s.el,e=>{if(e.target.closest('.panel'))return;dragging=true;moveTo(e)});
  s.on('pointermove',s.el,e=>{if(dragging)moveTo(e)});
  s.on('pointerup',s.el,()=>dragging=false);
  function moveTo(e){
    const r=$('#mg-world',s.el).getBoundingClientRect();
    targetX=clamp(e.clientX-r.left,60,W-60);
  }
  // keyboard for desktop
  const keys={};
  s.on('keydown',document,e=>keys[e.key]=true);
  s.on('keyup',document,e=>keys[e.key]=false);
  function spawnFood(){
    const types=['cake','cookie','choc'];
    const t=types[Math.floor(Math.random()*3)];
    const f={t,el:el('div'),x:clamp(catX+rand(-260,260),40,W-40),y:-60,vy:rand(140,190)+score*4,phase:'fall',tt:0};
    f.el.style.cssText=`position:absolute;left:${f.x}px;top:0;width:44px;margin-left:-22px;z-index:2;will-change:transform`
    f.el.innerHTML=FOOD(t);
    $('#mg-world',s.el).appendChild(f.el);
    foods.push(f);
  }
  let lastSpawn=0;
  s.raf(dt=>{
    cat.update(dt);
    // movement
    if(phase==='play'||phase==='walk'){
      if(keys['ArrowLeft'])targetX-=420*dt;
      if(keys['ArrowRight'])targetX+=420*dt;
      targetX=clamp(targetX,60,W-60);
      const prev=catX;
      catX=lerp(catX,targetX,1-Math.pow(0.0005,dt));
      cat.el.style.transform=`translateX(${catX-W/2}px) scaleX(${catX-prev<-0.5?-1:catX-prev>0.5?1:(cat._f||1)})`;
      cat._f=catX-prev<-0.5?-1:catX-prev>0.5?1:(cat._f||1);
      // camera follow
      const camX=clamp(catX-innerWidth/2,0,W-innerWidth);
      Cam.set(camX,0,1);
    }
    if(phase==='play'){
      spawnT+=dt;
      const interval=Math.max(.5,1.05-score*.025);
      if(spawnT>interval&&score<20){spawnT=0;spawnFood()}
      const mouthY=H*0.72,catLeft=W/2+(catX-W/2);
      for(const f of foods){
        if(f.phase==='fall'){
          f.y+=f.vy*dt;f.vy+=60*dt;
          f.el.style.transform=`translateY(${f.y}px) rotate(${f.y*.4}deg)`;
          if(f.y>mouthY-70&&f.y<mouthY+20&&Math.abs(f.x-catLeft)<70){
            f.phase='eat';f.tt=0;SFX.collect();buzz(8);
            cat.face('sq');
          }
          if(f.y>H+80){f.phase='gone';f.el.remove()}
        } else if(f.phase==='eat'){
          f.tt+=dt;
          const k=clamp(f.tt/.32,0,1);
          const mx=catLeft+(f.x>catLeft?24:-24),my=mouthY-58;
          const cx=lerp(f.x,mx,k),cy=lerp(f.y,my,k);
          f.el.style.transform=`translate(${cx-f.x}px,${cy-f.y}px) scale(${1-k*.7}) rotate(${k*180}deg)`;
          if(k>=1){
            f.phase='gone';f.el.remove();
            SFX.eat();buzz(10);
            score++;G.score=score;G.roundness=clamp(G.roundness+.05,0,1);cat.full=G.roundness;
            $('#mg-score',s.el).textContent=`Love collected: ${score} / 20`;
            cat.face('happy');
            if(score>=20){phase='full';onFull()}
          }
        }
      }
      for(let i=foods.length-1;i>=0;i--)if(foods[i].phase==='gone')foods.splice(i,1);
    }
    if(phase==='walk'){
      walkT+=dt;
      targetX+=Math.max(24,120-walkT*30)*dt;
      if(walkT>4.6){phase='sit';cat.setMode('exhausted');$('#mg-cap',s.el).textContent='';s.after(2200,()=>goto('final'))}
      if(walkT>3.4)cat.setMode('tired');
    }
  });
  function onFull(){
    $('#mg-title',s.el).style.opacity='0';
    $('#mg-cap',s.el).style.opacity='0';
    SFX.cheer();buzz([15,40,20]);confettiBurst(s.el,24);
    const m=$('#mg-msg',s.el);m.style.opacity='1';m.style.transform='translate(-50%,-50%) scale(1)';
    foods.forEach(f=>{f.phase='gone';f.el.remove()});foods.length=0;
    s.after(2400,()=>{
      m.style.opacity='0';m.style.transform='translate(-50%,-50%) scale(.7)';
      cat.setMode('tired');cat.face('tired');
      phase='walk';
    });
  }
  return s;
}

      cat.parts.pawR.style.transition='transform .6s ease';
      cat.parts.pawR.style.transform='rotate(38deg)';
      SFX.gift();buzz(10);
      s.after(1300,()=>{
        cat.parts.pawR.style.transform='rotate(0deg)';
        $('#fin-cap',s.el).textContent='Tap the envelope';
        envState=1;
        s.on('pointerdown',env,openLetter);
      });
    });
  });
  function openLetter(){
    if(envState!==1)return;envState=2;
    SFX.letter();buzz(12);
    const env=$('#fin-env',s.el);env.style.transition='all .6s ease';env.style.opacity='0';env.style.transform='translateY(46px) scale(2)';
    $('#fin-cap',s.el).textContent='';
    s.after(600,()=>{
      const L=$('#fin-letter',s.el);L.style.opacity='1';L.style.pointerEvents='auto';L.style.transform='translate(-50%,-50%) scale(1)';
      s.after(700,()=>$('#fin-l1',s.el).style.opacity='1');
      s.after(2800,()=>$('#fin-l2',s.el).style.opacity='1');
      s.after(6400,()=>{
        $('#fin-l3',s.el).style.opacity='1';SFX.ok();
        driftHearts();
        const b=$('#fin-replay',s.el);b.style.opacity='1';b.style.pointerEvents='auto';
      });
    });
  }
  function driftHearts(){
    s.every(900,()=>{
      const h=el('div');const x=rand(10,90);
      h.style.cssText=`position:absolute;left:${x}%;bottom:-30px;width:${rand(12,22)}px;z-index:2;animation:driftUp ${rand(5,8)}s ease-in forwards`;
      h.innerHTML=`<svg viewBox="0 0 32 29"><path d="M16,28 C5,19 1,13 1,7.6 C1,3.4 4.4,1 8,1 C11.4,1 14.2,3.2 16,6.2 C17.8,3.2 20.6,1 24,1 C27.6,1 31,3.4 31,7.6 C31,13 27,19 16,28 Z" fill="#e06a80" opacity=".8"/></svg>`;
      $('#fin-hearts',s.el).appendChild(h);
      s.after(8200,()=>h.remove());
    });
  }
  s.on('pointerdown',$('#fin-replay',s.el),()=>{SFX.ok();buzz(15);fullReset()});
  return s;
}

/* ============ REGISTRY + BOOT ============ */
const Scenes={code:scCode,heart:scHeart,card:scCard,garden:scGarden,tickle:scTickle,bouquet:scBouquet,letter:scLetter,cakeroom:scCakeroom,minigame:scMinigame,final:scFinal};
buildBG();
loop(dt=>Cam.update(dt));
addEventListener('resize',()=>{Cam.update(1)});
goto('code');
</script>
