L.innerHTML=`<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff1e2,#f6cfc4 60%,#e8b0b4);filter:blur(1px)"></div><div style="position:absolute;left:4%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(34vw,150px);filter:blur(1.6px)">${KAT('hap')}</div><div class="fin" id="f1" style="top:22vh;font-size:26px;font-style:italic">One last thing…</div><div class="fin" id="f2" style="top:34vh;font-size:clamp(18px,4.8vw,22px)">No matter how many surprises I put into this little world, none of them could ever fully explain how happy I am that you're here.</div><div class="fin" id="f3" style="top:62vh;font-size:clamp(24px,7vw,32px);font-style:italic;color:#b3263a">Happy Birthday, Hiney ${heart(30)}</div><button class="rp btn" id="rp">Replay</button>`;
music(c,[392,440,523,587,659],1.3,.02);
const on=(id,ms)=>c.after(ms,()=>c.q(id).classList.add('on'));on('#f1',1500);c.after(4500,()=>c.q('#f1').style.opacity=.35);on('#f2',5000);on('#f3',15500);c.after(15500,chime);
let nx=0;c.loop((dt,t)=>{if(t>nx&&performance.now()%1e9>0&&c.q('#f3').classList.contains('on')){nx=t+rnd(.9,1.7);if(L.querySelectorAll('.fh').length<12){const h=document.createElement('div');h.className='fh';h.style.cssText=`left:${rnd(5,92)}%;animation-duration:${rnd(7,12)}s;width:${rnd(12,24)}px`;h.innerHTML=heart('100%',['#f2a0ab','#d44a5d','#f4b9c7'][Math.floor(rnd(0,3))]);L.appendChild(h);c.after(12500,()=>h.remove())}}});
c.after(23000,()=>c.q('#rp').classList.add('on'));
c.on(c.q('#rp'),'click',()=>{if(c.q('#rp').classList.contains('on'))G.reset()})}});
})();
</script>
</body></html>
